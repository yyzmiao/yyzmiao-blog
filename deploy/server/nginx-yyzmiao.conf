server {
    listen 80;
    listen 443 ssl;
    server_name yyzmiao.top;

    root /var/www/yyzmiao-blog/current;
    index index.html;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /wp-sitemap.xml { return 301 /sitemap-index.xml; }
    location = /wp-login.php { return 410; }
    location ^~ /wp-admin/ { return 410; }
    location = /xmlrpc.php { return 410; }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|avif|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /404.html;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name www.yyzmiao.top;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 301 https://yyzmiao.top$request_uri;
}
